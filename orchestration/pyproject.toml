[project]
name = "orchestration"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "azure-storage-blob>=12.31.1",
    "dagster==1.13.29",
    "dagster-dbt>=0.29.29",
    "dbt-duckdb>=1.7.5",
    "duckdb>=1.5.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration"
registry_modules = [
    "orchestration.components.*",
]


