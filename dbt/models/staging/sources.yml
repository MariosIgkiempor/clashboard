version: 2
sources:
  - name: silver
    meta:
      external_location: "read_parquet('{{ 'az://silver' if env_var('STORAGE_MODE', 'local') == 'azurite' else env_var('CLASHBOARD_DATA_DIR', '../data') ~ '/silver' }}/{name}/*/*.parquet', hive_partitioning = true)"
    tables:
      - name: messages
        meta:
          dagster:
            asset_key: ["silver_messages"]
      - name: tool_calls
        meta:
          dagster:
            asset_key: ["silver_tool_calls"]
      - name: bash_commands
        meta:
          dagster:
            asset_key: ["silver_bash_commands"]
